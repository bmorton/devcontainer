#----------------------------
# Terminal compatibility
#----------------------------
# Advertise a tmux terminfo (true color, italics, strikethrough) to programs
# running inside tmux instead of the legacy screen-256color.
set -g default-terminal "tmux-256color"
# Tell tmux what the *outer* terminal (iTerm2 et al.) can do: 24-bit color,
# modified-key reporting (Shift+Enter), OSC 52 clipboard, hyperlinks, focus
# reporting, titles.
set -as terminal-features ",xterm*:RGB:extkeys:clipboard:hyperlinks:usstyle:focus:title"

# Let applications send escape sequences through to the outer terminal. Claude
# Code uses this for iTerm2/Kitty/Ghostty desktop notifications, the tab
# progress bar and inline images; without it tmux swallows them. On tmux 3.4+
# upgrade to `all` so sequences from windows that are not currently visible get
# through too, which is exactly when a "Claude finished" notification matters.
set -g allow-passthrough on
if -F '#{>=:#{version},3.4}' 'set -g allow-passthrough all'
# Report pane focus in/out to applications (Claude Code, vim, etc.).
set -g focus-events on
# Pass modified keys (Shift+Enter, Ctrl+Enter, ...) through to applications
# so Shift+Enter inserts a newline in Claude Code instead of submitting.
set -s extended-keys on
# Forward OSC 52 clipboard writes to the outer terminal. In iTerm2 also enable
# Settings > General > Selection > "Applications in terminal may access
# clipboard" (Claude Code's /terminal-setup toggles this for you).
set -g set-clipboard on
# Don't wait after Esc for a possible Alt-sequence; the default 500ms makes
# Esc feel broken in Claude Code and vim.
set -s escape-time 10

#----------------------------
# Key bindings
#----------------------------
# Change prefix key to Ctrl+a
unbind C-b
set -g prefix C-a
# Hit prefix twice to send it to the non-tmux application.
bind C-a send-prefix
# More straight forward key bindings for splitting
unbind %
bind | split-window -h
bind h split-window -h
unbind '"'
bind - split-window -v
bind v split-window -v
# Tab like window switching (-n: no prior escape seq)
bind -n S-down new-window
bind -n S-left prev
bind -n S-right next
# quick view of processes
bind '~' split-window "exec top"

#----------------------------
# Window moving / reordering
#----------------------------
# Shift+Up: prompt for a target index and swap the current window there.
# Focus follows the window to its new slot (no -d).
bind -n S-up command-prompt -p "move window to:" "swap-window -t '%%'"
# Renumber all windows sequentially to close gaps left by closed windows.
bind R move-window -r
# Automatically insert windows in the gaps when we create new ones
set-option -g renumber-windows on

#--------------------------
# Statusbar
#--------------------------
set -g status-interval 1
set -g status-justify centre # center align window list
set -g status-left-length 30
set -g status-left '#[fg=green] #(whoami)@#H #[default]'
set -g status-right '#[fg=green]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=black]%H:%M:%S#[default]'
# default statusbar colors
set -g status-style fg=white,bg=colour234,bright
# default window title colors
set-window-option -g window-status-style fg=white,bg=default,dim
# active window title colors
set-window-option -g window-status-current-style fg=white,bg=default,bright
# command/message line colors
set -g message-style fg=white,bg=black,bright
# Keep messages (e.g. the reload confirmation) on screen a little longer.
set -g display-time 2000

#----------------------------
# Miscellaneous
#----------------------------
# Reload configuration
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
# History
set -g history-limit 50000
# Start window and pane indices at 1.
set -g base-index 1
set -g pane-base-index 1
# Terminal emulator window title
set -g set-titles on
set -g set-titles-string '#S:#I.#P #W'
# Notifying if other windows has activities
setw -g monitor-activity off
set -g visual-activity on
set -g mouse on
