version: 2
updates:
  # Base image (FROM) in .devcontainer/Dockerfile. Tool versions are NOT here:
  # they live in .devcontainer/mise.toml, which Dependabot does not understand;
  # the "Bump mise tools" workflow handles those.
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions used by workflows in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
